name: Render CV PDFs

on:
  push:
    branches: [main]
    paths-ignore:
      - "pdf/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer
        run: npm install --no-save --package-lock=false puppeteer@24

      - name: Start static server
        run: nohup python3 -m http.server 4173 > /tmp/cv-http.log 2>&1 &

      - name: Wait for static server
        run: curl --retry 10 --retry-connrefused --silent --show-error -o /dev/null http://127.0.0.1:4173/

      - name: Render role PDFs
        run: node scripts/render-pdfs.mjs

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update rendered CV PDFs [skip ci]"
          git push
